services:
  postgres:
    image: postgres:16-alpine
    container_name: relix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: relix
      POSTGRES_PASSWORD: relix_dev_password
      POSTGRES_DB: relix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
